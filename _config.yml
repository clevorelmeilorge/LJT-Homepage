# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If working with JSON or YAML in the included Jekyll setup, the build may fail
# if your YAML is malformed.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Junteng Liu"
title_separator: "-"
subtitle: "Homepage"
name: "Junteng Liu"
description: "Junteng Liu's homepage."
url: "https://clevorelmeilorge.github.io"
repository: "clevorelmeilorge/LJT-Homepage"
github_username: "Vicent0205"
github_repo: "LJT-Homepage"
github_metadata: true
# twitter:
#   username: "junteng88716710"

# Include/Exclude from production build
# This is especially important for GitHub Pages
# if using custom plugins or gems
# include:
#   - _pages

# Search collection config
search_provider: lunr # Algorithms (https://www.algolia.com/)

# Pagination
paginate: 5
paginate_path: /page:num/

# Build settings
markdown: kramdown
# highlighter: rouge
# kramdown:
#   input: GFM
#   hard_wrap: false

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"
# One of: default, air-config, aqua, contrast, dark, dirt, neon, plums, sun, sunrise, teal

# Outputting
permalink: /:categories/:title/
# paginate: 5 # amount of posts to show
# paginate_path: /page:num/
timezone: Asia/Hong_Kong # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-seo-tag

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-redirect-from
  - jekyll-seo-tag

# Archives
# Type
#   - month: Monthly,yearly
#   - year: Yearly
#   - date: Daily,monthly,yearly
#   - category: Category
#   - tag: Tag
category_archive:
  type: categories
  path: /categories/
tag_archive:
  type: tags
  path: /tags/

# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

collections:
  portfolio:
    output: true
    sort_by: order
  publications:
    output: true
    sort_by: order
  talks:
    output: true
  teaching:
    output: true

# Reading Files
include:
  - .htaccess
  - _pages
  - _publications

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - /files/
  - /test/
  - /vendor/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Social
twitter_username: "junteng88716710"
og_image: /assets/images/500x300.png
